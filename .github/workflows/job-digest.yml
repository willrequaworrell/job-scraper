name: Job Digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 14 * * 0"

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run daily silent digest
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *' || github.event.schedule == '0 14 * * 0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m job_digest --delivery none

      - name: Run weekly application packet
        if: github.event.schedule == '0 14 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m job_digest --write-application-packet

      - name: Commit updated state and packets
        run: |
          if git diff --quiet -- data/job_digest.sqlite artifacts/daily_summaries artifacts/application_packets; then
            echo "No state, summary, or packet changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/job_digest.sqlite artifacts/daily_summaries artifacts/application_packets
          git commit -m "chore: update job digest artifacts [skip ci]"
          git push origin HEAD:main
